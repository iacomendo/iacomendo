# Stack da Evolution API (WhatsApp) — Fase 5.
#
# Espelha o que já roda localmente no Mac (docs/HANDOFF.md §4d /
# docs/OPERACAO-COMENDO-MKT.md §6.3): evoapicloud/evolution-api + Postgres +
# Redis, uma instância por gestor.
#
# Diferença chave pra rodar num VPS em vez do Mac:
#   - EVOLUTION_URL (nas variáveis do app) passa a ser a URL pública do VPS
#     (com HTTPS na frente — ex. Caddy/Traefik/Nginx — não http://localhost).
#   - Cada instância de gestor precisa ser RECRIADA e reconectada aqui
#     (escanear o QR de novo) — sessões antigas não migram do Docker do Mac
#     pro Docker do VPS.
#   - Rode com --restart unless-stopped (já configurado abaixo) pra
#     sobreviver a reboot do host.
#
# Uso:
#   cp .env.example .env   # preencha EVOLUTION_API_KEY com uma chave NOVA
#                          # (rotacionada — não reaproveitar a antiga que já
#                          # circulou em texto puro; ver docs/HANDOFF.md §10)
#   docker compose up -d
#   # Depois: acessar http://<host>:8080/manager pra criar/reconectar
#   # instâncias (ou pelo painel.py, que já sabe fazer isso).

services:
  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD no .env}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - evolution_redis_data:/data

  evolution-api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      - evolution-postgres
      - evolution-redis
    ports:
      # Em produção, prefira colocar um proxy HTTPS na frente (Caddy/
      # Traefik/Nginx) em vez de expor esta porta direto na internet.
      - "8080:8080"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env — rotacionada, não a antiga}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances:
